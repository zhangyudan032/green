<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO优化 -->
    <meta name="description" content="天眼狼王格林的传奇故事 - 跨越16年，一场人与狼的双向救赎。从成都到若尔盖草原，从幼狼到狼王的完整时间线叙事。" />
    <meta name="keywords" content="格林,狼王,若尔盖草原,重返狼群,李微漪,野生动物保护" />
    <meta name="author" content="Claude Code" />

    <!-- Open Graph / 社交媒体分享 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="天眼狼王·格林 - 时间线叙事版" />
    <meta property="og:description" content="跨越16年，一场人与狼的双向救赎" />

    <title>天眼狼王·格林 - 时间线叙事版 (v3.0.0)</title>

    <style>
      /* 页面加载动画 */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s, visibility 0.5s;
      }

      #loading.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loader {
        width: 60px;
        height: 60px;
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        color: white;
        margin-top: 20px;
        font-size: 18px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- 加载动画 -->
    <div id="loading">
      <div class="loader"></div>
      <div class="loading-text">加载格林的故事中...</div>
    </div>

    <!-- React应用挂载点 -->
    <div id="root"></div>

    <!-- 引入主应用 -->
    <script type="module" src="/src/main_v3.jsx"></script>

    <!-- 隐藏加载动画 -->
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('loading').classList.add('hidden');
        }, 500);
      });
    </script>
  </body>
</html>
